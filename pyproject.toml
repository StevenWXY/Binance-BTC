[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-btc-regime"
version = "0.1.0"
description = "Research-grade BTCUSDT USD-M perpetual regime-switching backtest"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.scripts]
btc-regime = "btc_regime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
